name: Website

on:
  push:
    branches: [main]
    paths: [site/**, manual/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manual/package-lock.json
      # The manual is built with Astro Starlight and served beside the
      # website, at /solmara/manual/.
      - name: Build the manual
        working-directory: manual
        run: |
          npm ci
          npm run build
      - name: Put the manual in the site
        run: cp -r manual/dist site/manual
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
